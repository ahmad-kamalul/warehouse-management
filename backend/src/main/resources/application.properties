spring.application.name=warehouse-management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/warehouse-management}
spring.datasource.username=${DB_USER:warehouse-management}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns schema changes; Hibernate validates the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=warehouse-management
app.jwt.ttl-seconds=3600
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.com.ahmad.warehousemanagement=INFO
logging.level.org.hibernate.SQL=WARN
